version: 2

project_name: logfort

before:
  hooks:
    - go mod tidy

builds:
  - id: logfort
    main: ./cmd/logfort
    binary: logfort
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: logfort
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - LICENSE
      - README.md
      - docker-compose.yml

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

dockers:
  - id: logfort-amd64
    ids:
      - logfort
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/unwinds/logfort:{{ .Tag }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=logfort"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/unwinds/logfort"
    dockerfile: Dockerfile.release

  - id: logfort-arm64
    ids:
      - logfort
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/unwinds/logfort:{{ .Tag }}-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=logfort"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/unwinds/logfort"
    dockerfile: Dockerfile.release

  - id: logfort-armv7
    ids:
      - logfort
    goos: linux
    goarch: arm
    goarm: "7"
    image_templates:
      - "ghcr.io/unwinds/logfort:{{ .Tag }}-armv7"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm/v7"
      - "--label=org.opencontainers.image.title=logfort"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/unwinds/logfort"
    dockerfile: Dockerfile.release

docker_manifests:
  - name_template: "ghcr.io/unwinds/logfort:{{ .Tag }}"
    image_templates:
      - "ghcr.io/unwinds/logfort:{{ .Tag }}-amd64"
      - "ghcr.io/unwinds/logfort:{{ .Tag }}-arm64"
      - "ghcr.io/unwinds/logfort:{{ .Tag }}-armv7"
  - name_template: "ghcr.io/unwinds/logfort:latest"
    image_templates:
      - "ghcr.io/unwinds/logfort:{{ .Tag }}-amd64"
      - "ghcr.io/unwinds/logfort:{{ .Tag }}-arm64"
      - "ghcr.io/unwinds/logfort:{{ .Tag }}-armv7"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^chore:"
      - "^test:"
  groups:
    - title: "New features"
      regexp: "^feat"
      order: 0
    - title: "Bug fixes"
      regexp: "^fix"
      order: 1
    - title: "Other"
      order: 999
